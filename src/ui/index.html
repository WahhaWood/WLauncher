<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <title>WLauncher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>

    <main>
      <header class="topbar">
        <div class="brand">
          <svg class="mark" width="30" height="22" viewBox="0 0 34 24" aria-hidden="true">
            <defs>
              <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#6d9bff" />
                <stop offset="1" stop-color="#8a5cff" />
              </linearGradient>
            </defs>
            <path
              d="M3 3 L9.5 21 L17 8.5 L24.5 21 L31 3"
              fill="none"
              stroke="url(#markGrad)"
              stroke-width="4.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <div class="brand-text">
            <h1>WLAUNCHER</h1>
            <div class="server-status">
              <span class="dot" id="server-dot"></span>
              <span id="subtitle">Сборка WLauncher</span>
            </div>
          </div>
        </div>
        <span class="version" id="version-tag"></span>
      </header>

      <section class="card account-card">
        <label class="field-label" for="nickname">Игровой ник</label>
        <input
          id="nickname"
          type="text"
          maxlength="16"
          autocomplete="off"
          spellcheck="false"
          placeholder="Steve"
        />
      </section>

      <button id="play" class="play-button" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M8 5.5v13l11-6.5z" />
        </svg>
        <span>Играть</span>
      </button>

      <div class="progress" id="progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <p class="status-line" id="status-line"></p>
      <p class="hint" id="hint"></p>

      <section class="card console-card">
        <header class="console-header">
          <span>Консоль</span>
          <button id="console-clear" class="mini-button" type="button">Очистить</button>
        </header>
        <pre id="log" aria-live="polite"></pre>
      </section>

      <footer class="toolbar">
        <button id="game-dir-btn" class="tool-button" type="button" title="Открыть папку игры">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
          </svg>
        </button>
        <button id="sync-btn" class="tool-button" type="button" title="Проверить сборку">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10" />
            <polyline points="1 20 1 14 7 14" />
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10" />
            <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
          </svg>
        </button>
        <button id="settings-btn" class="tool-button" type="button" title="Настройки">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="21" x2="4" y2="14" /><line x1="4" y1="10" x2="4" y2="3" />
            <line x1="12" y1="21" x2="12" y2="12" /><line x1="12" y1="8" x2="12" y2="3" />
            <line x1="20" y1="21" x2="20" y2="16" /><line x1="20" y1="12" x2="20" y2="3" />
            <line x1="1" y1="14" x2="7" y2="14" /><line x1="9" y1="8" x2="15" y2="8" />
            <line x1="17" y1="16" x2="23" y2="16" />
          </svg>
        </button>
        <button id="logs-btn" class="tool-button" type="button" title="Открыть логи">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" />
          </svg>
        </button>
      </footer>
    </main>

    <div class="modal-overlay" id="settings-modal">
      <div class="modal">
        <header class="modal-header">
          <h2>Настройки</h2>
          <button id="settings-cancel-x" class="icon-button" type="button">✕</button>
        </header>

        <label class="field">
          <span>Папка сборки</span>
          <input id="setting-game-dir" type="text" placeholder="По умолчанию" />
        </label>

        <div class="field-row">
          <label class="field">
            <span>Мин. ОЗУ (МБ)</span>
            <input id="setting-min-ram" type="number" min="512" max="32768" step="512" />
          </label>
          <label class="field">
            <span>Макс. ОЗУ (МБ)</span>
            <input id="setting-max-ram" type="number" min="512" max="32768" step="512" />
          </label>
        </div>

        <div class="field-row">
          <label class="field">
            <span>Ширина</span>
            <input id="setting-width" type="number" min="640" max="7680" step="1" />
          </label>
          <label class="field">
            <span>Высота</span>
            <input id="setting-height" type="number" min="480" max="4320" step="1" />
          </label>
        </div>

        <label class="field">
          <span>JVM-аргументы (дополнительные)</span>
          <input id="setting-jvm-args" type="text" placeholder="-XX:+UseG1GC" />
        </label>

        <label class="checkbox">
          <input id="setting-aikar" type="checkbox" />
          <span>Оптимизированные JVM-флаги (Aikar)</span>
        </label>

        <label class="checkbox">
          <input id="setting-fullscreen" type="checkbox" />
          <span>Полноэкранный режим</span>
        </label>

        <div class="modal-actions">
          <button id="settings-save" type="button">Сохранить</button>
          <button id="settings-cancel" type="button" class="secondary">Отмена</button>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <title>Wahha Launcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-logo">W</div>
          <div class="brand-text">
            <h1>Wahha</h1>
            <p>Launcher <span class="version" id="version-tag"></span></p>
          </div>
        </div>

        <div class="sidebar-block">
          <label class="field-label" for="nickname">Ник в игре</label>
          <input
            id="nickname"
            type="text"
            maxlength="16"
            autocomplete="off"
            spellcheck="false"
            placeholder="Steve"
          />
        </div>

        <button id="play" class="play-button" type="button">Играть</button>

        <div class="progress" id="progress">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="hint" id="hint"></p>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-actions">
          <button id="settings-btn" class="ghost-button" type="button">Настройки</button>
          <button id="logs-btn" class="ghost-button" type="button">Логи</button>
        </div>
      </aside>

      <main class="content">
        <header class="content-header">
          <div>
            <h2>Обзор</h2>
            <p class="content-subtitle" id="subtitle">Готов к запуску</p>
          </div>
          <span class="status-pill" id="status-pill">Готов</span>
        </header>

        <section class="cards">
          <div class="card">
            <span class="card-title">Сервер</span>
            <span class="card-value" id="server-value">не настроен</span>
          </div>
          <div class="card">
            <span class="card-title">Сборка</span>
            <span class="card-value" id="pack-value">не подключена</span>
          </div>
          <div class="card">
            <span class="card-title">Minecraft</span>
            <span class="card-value">26.1.2</span>
          </div>
          <div class="card">
            <span class="card-title">Загрузчик</span>
            <span class="card-value">NeoForge</span>
          </div>
          <div class="card">
            <span class="card-title">Java</span>
            <span class="card-value">Temurin 25</span>
          </div>
        </section>

        <section class="console-card">
          <header class="console-header">
            <span>Консоль</span>
            <button id="console-clear" class="mini-button" type="button">Очистить</button>
          </header>
          <pre id="log" aria-live="polite"></pre>
        </section>
      </main>
    </div>

    <div class="modal-overlay" id="settings-modal">
      <div class="modal">
        <header class="modal-header">
          <h2>Настройки</h2>
          <button id="settings-cancel-x" class="icon-button" type="button">✕</button>
        </header>

        <label class="field">
          <span>Папка сборки</span>
          <input id="setting-game-dir" type="text" placeholder="По умолчанию" />
        </label>

        <div class="field-row">
          <label class="field">
            <span>Мин. ОЗУ (МБ)</span>
            <input id="setting-min-ram" type="number" min="512" max="32768" step="512" />
          </label>
          <label class="field">
            <span>Макс. ОЗУ (МБ)</span>
            <input id="setting-max-ram" type="number" min="512" max="32768" step="512" />
          </label>
        </div>

        <div class="field-row">
          <label class="field">
            <span>Ширина</span>
            <input id="setting-width" type="number" min="640" max="7680" step="1" />
          </label>
          <label class="field">
            <span>Высота</span>
            <input id="setting-height" type="number" min="480" max="4320" step="1" />
          </label>
        </div>

        <label class="field">
          <span>JVM-аргументы (дополнительные)</span>
          <input id="setting-jvm-args" type="text" placeholder="-XX:+UseG1GC" />
        </label>

        <label class="checkbox">
          <input id="setting-fullscreen" type="checkbox" />
          <span>Полноэкранный режим</span>
        </label>

        <div class="modal-actions">
          <button id="settings-save" type="button">Сохранить</button>
          <button id="settings-cancel" type="button" class="secondary">Отмена</button>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
